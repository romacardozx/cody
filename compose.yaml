# SQL Server para desarrollo. Levantar con: docker compose up -d
# Las contraseñas salen del archivo .env (copiar .env.example a .env).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: cody-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - cody-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Corre una vez y termina: crea la base "cody" y el login "cody_app" si no existen.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$SA_PASSWORD\" -C -b -v DB_PASSWORD=\"$$DB_PASSWORD\" -i /init.sql"]
    restart: "no"

volumes:
  cody-sqlserver-data:
