# PostgreSQL for development. Start it with: docker compose up -d
# The password comes from the .env file (copy .env.example to .env).
# On first start the image creates the "cody" database owned by the "cody_app" user.
services:
  postgres:
    image: postgres:17
    container_name: cody-postgres
    environment:
      POSTGRES_DB: cody
      POSTGRES_USER: cody_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cody-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cody_app -d cody"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  cody-postgres-data:
