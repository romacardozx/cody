spring.application.name=cody

# --- Database (PostgreSQL in Docker: docker compose up -d) ---
# DB_PASSWORD comes from the .env file (never committed) or from an environment variable.
# In production, the SPRING_DATASOURCE_URL and SPRING_DATASOURCE_USERNAME variables override them.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/cody
spring.datasource.username=cody_app
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Sample data ---
# data.sql runs on every startup, after Hibernate creates the tables.
# That is why every INSERT in data.sql must be idempotent (see the comment in that file).
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# --- Static files (the React app) ---
# The jar stores every file with a 1980 timestamp (reproducible builds). Sent as Last-Modified, it
# makes browsers cache old files for years and answer "304 not modified" after a new build.
# Caching is set by StaticCacheFilter instead.
spring.web.resources.cache.use-last-modified=false

# --- Swagger UI: http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
