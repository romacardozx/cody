spring.application.name=cody

# --- Base de datos (SQL Server en Docker: docker compose up -d) ---
# DB_PASSWORD sale del archivo .env (no se commitea) o de una variable de entorno.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cody;encrypt=true;trustServerCertificate=true
spring.datasource.username=cody_app
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Datos de ejemplo ---
# data.sql corre en cada arranque, después de que Hibernate cree las tablas.
# Por eso cada INSERT de data.sql tiene que ser idempotente (ver el comentario en ese archivo).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Swagger UI: http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
